name: Guardas FIS

# Va en cada repo de equipo (vía Repository_Template_FIS). Revisa cada pull request
# contra las prácticas del curso y explica qué falta. No corrige nada por el equipo.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  flujo:
    name: GitFlow, Conventional Commits y trazabilidad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const convencional = /^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^)]+\))?!?: \S/;
            const problemas = [];

            // 1. Nombre de la rama (GitFlow)
            const rama = pr.head.ref;
            if (!/^(feature|fix|bugfix|hotfix|release|docs|chore|test|refactor)\/[a-z0-9][a-z0-9._-]*$/.test(rama) && rama !== 'develop') {
              problemas.push(`La rama \`${rama}\` no sigue el formato \`tipo/descripcion-corta\` (por ejemplo \`feature/12-registro-usuarios\`).`);
            }

            // 2. Destino del PR (GitFlow)
            const principal = context.payload.repository.default_branch;
            if (pr.base.ref === principal && !/^(release|hotfix)\//.test(rama) && rama !== 'develop') {
              problemas.push(`Solo \`develop\`, \`release/*\` y \`hotfix/*\` se integran a \`${principal}\`. ¿A qué rama debería ir este cambio?`);
            }

            // 3. Título del PR
            if (!convencional.test(pr.title)) {
              problemas.push(`El título del PR no sigue Conventional Commits: «${pr.title}».`);
            }

            // 4. Issue asociada
            if (!/(close[sd]?|fix(e[sd])?|resolve[sd]?|cierra|resuelve)\s+#\d+/i.test(pr.body || '')) {
              problemas.push('La descripción no dice qué issue cierra (por ejemplo `Closes #12`). ¿A qué historia o tarea pertenece este trabajo?');
            }

            // 5. Mensajes de commit
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner: context.repo.owner, repo: context.repo.repo, pull_number: pr.number, per_page: 100,
            });
            const malos = commits
              .filter(c => c.parents.length < 2)
              .map(c => c.commit.message.split('\n')[0])
              .filter(m => !convencional.test(m));
            if (malos.length) {
              problemas.push(`${malos.length} commit(s) no siguen Conventional Commits, por ejemplo: «${malos[0]}».`);
            }

            if (problemas.length) {
              await core.summary
                .addHeading('Antes de integrar, revisen esto')
                .addList(problemas)
                .addRaw('Las reglas están en CONTRIBUTING.md.')
                .write();
              core.setFailed(problemas.join('\n'));
            } else {
              await core.summary.addRaw('✅ El PR sigue el flujo de trabajo del curso.').write();
            }
