# Puerta de entrada del agente FIS: nginx delante del portal (aplicación web) y de Metabase.
#
#   /            portal del profesor (gestiona su propio inicio de sesión y sus cabeceras de seguridad)
#   /metabase/   Metabase, solo con sesión iniciada en el portal (para los tableros incrustados)
#   /sonar/      SonarQube del curso (análisis interno), solo con sesión iniciada en el portal
#   /salud       chequeo de salud para el proxy reverso
#
# Pensado para quedar detrás de un proxy reverso con HTTPS, en la raíz de un dominio o bajo una ruta
# (/fis/) siempre que el proxy quite ese prefijo. Todos los enlaces del portal son relativos.

# Ingreso: como máximo 10 intentos por minuto por dirección de origen (además del bloqueo por usuario).
limit_req_zone $binary_remote_addr zone=fis_ingreso:1m rate=10r/m;

server {
    listen 80;
    server_name _;
    server_tokens off;
    absolute_redirect off;
    client_max_body_size 256k;

    # DNS interno de Docker: si un contenedor se recrea con otra IP, nginx la vuelve a resolver.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $portal portal:8000;
    set $metabase metabase:3000;
    set $sonarqube sonarqube:9000;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_http_version 1.1;

    location = /salud { access_log off; default_type text/plain; return 200 "ok\n"; }

    location = /_sesion {
        internal;
        proxy_pass http://$portal/_sesion;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    location = /ingresar {
        limit_req zone=fis_ingreso burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://$portal;
    }

    location /metabase/ {
        auth_request /_sesion;
        rewrite ^/metabase/(.*)$ /$1 break;
        proxy_pass http://$metabase;
        proxy_read_timeout 120s;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # SonarQube del curso (análisis interno), con su contexto web en /sonar.
    location /sonar/ {
        auth_request /_sesion;
        proxy_pass http://$sonarqube;
        proxy_read_timeout 120s;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location / {
        proxy_pass http://$portal;
        proxy_read_timeout 120s;
    }
}
