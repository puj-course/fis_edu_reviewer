# Sitio del profesor: páginas estáticas que genera el revisor en /datos/sitio.
# Contiene pre-notas y datos de estudiantes: toda página exige sesión. Sin sesión, nginx responde con
# la página de ingreso del servicio `acceso` (en la misma URL), y al ingresar se recarga la página pedida.
#
# Pensado para quedar detrás de un proxy reverso con HTTPS (en la raíz de un dominio o bajo una ruta
# como /fis/, siempre que el proxy quite ese prefijo). Todos los enlaces del sitio son relativos.

# Ingreso: como máximo 10 intentos por minuto por dirección de origen (además del bloqueo por usuario).
limit_req_zone $binary_remote_addr zone=fis_ingreso:1m rate=10r/m;

server {
    listen 80;
    server_name _;
    root /datos/sitio;
    index index.html;
    charset utf-8;

    server_tokens off;
    absolute_redirect off;   # redirecciones relativas: no filtran el puerto interno detrás del proxy
    client_max_body_size 8k;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; form-action 'self'; frame-ancestors 'none'; base-uri 'none'" always;
    add_header Cache-Control "no-store" always;

    # Para el chequeo de salud del proxy reverso (no expone datos).
    location = /salud { access_log off; default_type text/plain; return 200 "ok\n"; }

    location = /_sesion {
        internal;
        proxy_pass http://acceso:8000/verificar;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    location @ingreso {
        limit_req zone=fis_ingreso burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://acceso:8000;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /salir {
        proxy_pass http://acceso:8000/salir;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location ~ /\. { deny all; }
    location ~ \.tmp$ { deny all; }

    location / {
        auth_request /_sesion;
        error_page 401 = @ingreso;   # también recibe el formulario de ingreso (POST a la página pedida)
        try_files $uri $uri/ =404;
    }
}
